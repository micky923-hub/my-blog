# 원본: 블루엠 표준 하네스 v0.6.0 (media). 이 파일은 고치지 말고 원본에서 고친 뒤 다시 설치.
# 블루엠 하네스 1층: 기본 검사 (모든 프로젝트)
name: bluem-basic-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기본 검사 (비밀 정보·민감 파일·큰 파일)
        run: bash harness/checks/check-basic.sh
