name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1-5'   # 평일 11:30 KST (수출입은행 매매기준율 발표 직후)
    - cron: '30 6 * * 1-5'   # 평일 15:30 KST (11:30 실패·지연 대비 재시도)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Fetch exchange rates (Korea Eximbank)
        run: node apps/exchange-fee-calculator/tools/fetch-rates.js --out dist/apps/exchange-fee-calculator/rates.json
        env:
          KOREAEXIM_API_KEY: ${{ secrets.KOREAEXIM_API_KEY }}
        continue-on-error: true
        timeout-minutes: 3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
