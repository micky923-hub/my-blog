name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1-5'   # 평일 11:30 KST (수출입은행 매매기준율 발표 직후)
    - cron: '30 6 * * 1-5'   # 평일 15:30 KST (11:30 실패·지연 대비 재시도)
    - cron: '20 21 * * *'    # 매일 06:20 KST (기상청 05시 발표 후 날씨)
    - cron: '20 9 * * *'     # 매일 18:20 KST (17시 발표·당일 시세)
  workflow_dispatch:
  # 음성 생성(audio.yml)이 새 MP3를 올렸을 때만 다시 배포한다(아래 audio-check 작업이 판단).
  workflow_run:
    workflows: ["Generate audio"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 묶음(pages)은 워크플로 전체가 아니라 build-and-deploy 작업에만 건다.
# 그래야 음성 실행 뒤 "할 일 없는" workflow_run 실행(audio-check 만 돌고 끝남)이
# 대기 중인 진짜 배포(push·예약)를 밀어내 취소하지 않는다.

jobs:
  # workflow_run 으로 시작했을 때만 돈다: 음성 실행이 "audio-uploaded" 표시를 남겼는지 확인한다.
  # (아무것도 만들지 않았거나 비밀값이 없어 건너뛴 실행이면 재배포하지 않는다.)
  audio-check:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          go=false
          if [ "$RUN_EVENT" = "push" ] || [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "audio-uploaded")] | length')"
            if [ "${n:-0}" -gt 0 ]; then go=true; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "새 음성 업로드: $go"

  build-and-deploy:
    needs: audio-check
    if: ${{ !cancelled() && (needs.audio-check.result == 'skipped' || needs.audio-check.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 음성 목록 파일(공개 주소, 비밀값 없음). 못 받으면 플레이어 없이 빌드·배포한다.
      - name: Fetch audio manifest
        run: node tools/audio/fetch-manifest.js --out audio-manifest.json
        continue-on-error: true
        timeout-minutes: 1

      - run: npm run build

      - name: Fetch exchange rates (Korea Eximbank)
        run: node apps/exchange-fee-calculator/tools/fetch-rates.js --out dist/apps/exchange-fee-calculator/rates.json
        env:
          KOREAEXIM_API_KEY: ${{ secrets.KOREAEXIM_API_KEY }}
        continue-on-error: true
        timeout-minutes: 3

      - name: Fetch weather & produce prices (KMA, KAMIS)
        run: node apps/weather-economy/tools/fetch-weather-economy.js --out dist/apps/weather-economy/data.json
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        continue-on-error: true
        timeout-minutes: 4

      - name: Fetch economy indicators (BOK ECOS)
        run: node apps/economy-dashboard/tools/fetch-economy.js --out dist/apps/economy-dashboard/data.json
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        continue-on-error: true
        timeout-minutes: 3

      # IndexNow 1단계: 지금 사이트의 sitemap.xml(이전 버전)과 이번 빌드를 비교해 새 글·고친 글 주소를 고른다.
      - name: IndexNow plan
        run: node tools/indexnow/indexnow.js plan --out indexnow-urls.json
        continue-on-error: true
        timeout-minutes: 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow 2단계: 배포가 끝난 뒤 고른 주소를 빙·네이버 등에 알린다. 실패해도 배포에는 영향 없음.
      - name: IndexNow submit
        run: node tools/indexnow/indexnow.js submit --in indexnow-urls.json
        continue-on-error: true
        timeout-minutes: 1
