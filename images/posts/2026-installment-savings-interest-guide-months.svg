    <rect x="32" y="396" width="496" height="52" rx="12" fill="#e0f2fe"/>
    <text x="280" y="421" text-anchor="middle" font-size="17" font-weight="800" fill="#0c4a6e">평균 6.5개월 → 예금 이자의 54.2%</text>
    <text x="280" y="441" text-anchor="middle" font-size="15" fill="#0c4a6e">연 4% · 월 50만 원: 세전 13만 원 (예금 24만 원)</text>
