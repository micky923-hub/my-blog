    <text x="335.0" y="352" text-anchor="middle" font-size="15" fill="#475569">8</text>
    <rect x="360" y="262" width="30" height="68" rx="5" fill="#3b82f6"/>
    <text x="375.0" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4</text>
    <text x="375.0" y="352" text-anchor="middle" font-size="15" fill="#475569">9</text>
    <rect x="400" y="279" width="30" height="51" rx="5" fill="#3b82f6"/>
