    <text x="215.0" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">8</text>
    <text x="215.0" y="352" text-anchor="middle" font-size="15" fill="#475569">5</text>
    <rect x="240" y="211" width="30" height="119" rx="5" fill="#3b82f6"/>
    <text x="255.0" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">7</text>
