    <rect x="280" y="228" width="30" height="102" rx="5" fill="#3b82f6"/>
    <text x="295.0" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">6</text>
    <text x="295.0" y="352" text-anchor="middle" font-size="15" fill="#475569">7</text>
    <rect x="320" y="245" width="30" height="85" rx="5" fill="#3b82f6"/>
