    <text x="95.0" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">11</text>
    <text x="95.0" y="352" text-anchor="middle" font-size="15" fill="#475569">2</text>
    <rect x="120" y="160" width="30" height="170" rx="5" fill="#3b82f6"/>
    <text x="135.0" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">10</text>
    <text x="135.0" y="352" text-anchor="middle" font-size="15" fill="#475569">3</text>
    <rect x="160" y="177" width="30" height="153" rx="5" fill="#3b82f6"/>
    <text x="175.0" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">9</text>
    <text x="175.0" y="352" text-anchor="middle" font-size="15" fill="#475569">4</text>
