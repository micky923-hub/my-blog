    <text x="32" y="88" font-size="17" fill="#475569">12개월 적금 · 막대 위 숫자 = 이자 받는 개월</text>
    <rect x="40" y="126" width="30" height="204" rx="5" fill="#1d4ed8"/>
    <text x="55.0" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">12</text>
    <text x="55.0" y="352" text-anchor="middle" font-size="15" fill="#475569">1</text>
