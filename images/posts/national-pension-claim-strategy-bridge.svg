<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" aria-labelledby="t d">
  <title id="t">퇴직 후 국민연금 공백 5년 메우기</title>
  <desc id="d">60세에 퇴직하고 국민연금을 65세부터 월 100만 원 받는 사람의 예시입니다. 60~64세에는 IRP 퇴직금에서 월 90만 원, 연금저축에서 월 25만 원을 꺼내 월 115만 원을 받고, 65세부터 깎이지 않은 국민연금 월 100만 원과 남은 사적연금을 받습니다. 60세에 조기수령하면 평생 월 70만 원입니다.</desc>
  <rect x="0" y="0" width="560" height="540" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">60~65세 공백, 이렇게 메우세요</text>
    <text x="32" y="88" font-size="17" fill="#475569">국민연금 정상 월 100만 원 · 1969년 이후 출생</text>

    <text x="32" y="138" font-size="16" font-weight="700" fill="#475569">60세</text>
    <text x="214" y="138" font-size="16" font-weight="700" fill="#475569">65세</text>
    <text x="490" y="138" font-size="16" font-weight="700" fill="#475569">평생</text>
    <line x1="32" y1="148" x2="528" y2="148" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="214" y1="142" x2="214" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="32" y="186" font-size="20" font-weight="800" fill="#166534">✓ 사적연금으로 메우기</text>
    <rect x="32" y="200" width="178" height="96" rx="10" fill="#3b82f6"/>
    <text x="121" y="232" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">월 115만</text>
    <text x="121" y="258" text-anchor="middle" font-size="16" fill="#ffffff">IRP 90만</text>
    <text x="121" y="280" text-anchor="middle" font-size="16" fill="#ffffff">연금저축 25만</text>
    <rect x="218" y="200" width="310" height="96" rx="10" fill="#16a34a"/>
    <text x="373" y="236" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">국민연금 월 100만</text>
    <text x="373" y="266" text-anchor="middle" font-size="16" fill="#ffffff">+ 남은 사적연금</text>

    <text x="32" y="344" font-size="20" font-weight="800" fill="#92400e">60세 조기수령</text>
    <rect x="32" y="358" width="496" height="52" rx="10" fill="#f59e0b"/>
    <text x="280" y="391" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">평생 월 70만 원 (30% 감액)</text>

    <rect x="32" y="436" width="496" height="84" rx="12" fill="#e0f2fe"/>
    <text x="52" y="468" font-size="18" font-weight="800" fill="#075985">국민연금은 깎지 말고 지키세요</text>
    <text x="52" y="496" font-size="16" fill="#075985">퇴직금 IRP·연금저축은 55세부터 꺼낼 수 있어요</text>
  </g>
</svg>
