<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">세전 수익 70만 원일 때 예금과 저표면금리 채권의 세금</title>
  <desc id="d">액면 1,000만 원, 표면금리 1.5%, 만기 2년 남은 국채를 960만 원에 사면 이자 30만 원과 만기 차익 40만 원으로 세전 70만 원을 법니다. 세금은 이자 30만 원에만 붙어 4만 6,200원입니다. 같은 70만 원을 예금 이자로 받으면 15.4%인 10만 7,800원을 내므로 6만 1,600원 차이가 납니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">같은 70만 원, 다른 세금</text>
    <text x="32" y="90" font-size="18" fill="#475569">세전 수익 70만 원 · 지방소득세 포함</text>

    <text x="32" y="144" font-size="20" font-weight="700" fill="#0f172a">예금 이자</text>
    <text x="32" y="170" font-size="16" fill="#475569">70만 원 전부 × 15.4%</text>
    <rect x="32" y="182" width="360" height="44" rx="8" fill="#94a3b8"/>
    <text x="212" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">10만 7,800원</text>

    <text x="32" y="270" font-size="20" font-weight="700" fill="#0f172a">표면금리 1.5% 채권 직접 매수</text>
    <text x="32" y="296" font-size="16" fill="#475569">이자 30만 원 × 15.4% · 차익 40만 원 비과세</text>
    <rect x="32" y="308" width="154" height="44" rx="8" fill="#16a34a"/>
    <text x="200" y="338" font-size="20" font-weight="800" fill="#166534">4만 6,200원</text>

    <rect x="32" y="380" width="496" height="112" rx="12" fill="#dcfce7"/>
    <text x="52" y="414" font-size="18" font-weight="800" fill="#166534">세금 6만 1,600원을 아껴요</text>
    <text x="52" y="444" font-size="16" fill="#166534">액면 1,000만 원 국채를 960만 원에 사서</text>
    <text x="52" y="470" font-size="16" fill="#166534">2년 뒤 만기까지 보유 · 단순 계산</text>
  </g>
</svg>
