<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 532" role="img" aria-labelledby="t d">
  <title id="t">금리별 신용대출 1년 이자</title>
  <desc id="d">신용대출 3천만 원을 이자만 내면 금리 5%일 때 1년 150만 원, 6%일 때 180만 원, 7%일 때 210만 원을 냅니다. 금리 2%p 차이로 매년 60만 원이 달라집니다.</desc>
  <rect x="0" y="0" width="560" height="532" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">금리 1%p가 바꾸는 1년 이자</text>
    <text x="32" y="90" font-size="18" fill="#475569">신용대출 3천만 원 · 이자만 낼 때</text>
    <text x="32" y="142" font-size="19" font-weight="700" fill="#0f172a">금리 5%</text>
    <rect x="32" y="154" width="307.1" height="44" rx="8" fill="#16a34a"/>
    <text x="325.1" y="183" text-anchor="end" font-size="19" font-weight="800" fill="#ffffff">150만 원</text>
    <text x="32" y="236" font-size="19" font-weight="700" fill="#0f172a">금리 6%</text>
    <rect x="32" y="248" width="368.6" height="44" rx="8" fill="#f59e0b"/>
    <text x="386.6" y="277" text-anchor="end" font-size="19" font-weight="800" fill="#ffffff">180만 원</text>
    <text x="32" y="330" font-size="19" font-weight="700" fill="#0f172a">금리 7%</text>
    <rect x="32" y="342" width="430.0" height="44" rx="8" fill="#dc2626"/>
    <text x="448.0" y="371" text-anchor="end" font-size="19" font-weight="800" fill="#ffffff">210만 원</text>
    <rect x="32" y="418" width="496" height="90" rx="12" fill="#e0f2fe"/>
    <text x="52" y="448" font-size="18" font-weight="800" fill="#075985">2%p 차이면 매년 60만 원</text>
    <text x="52" y="475" font-size="18" fill="#075985">점수 관리가 곧 이자 관리예요</text>
  </g>
</svg>
