<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">70세 부모님 1명, 누가 받느냐에 따라 줄어드는 세금</title>
  <desc id="d">연말정산 환급 계산기(2026년 귀속, 지방소득세 포함)로 본인 1명에 70세 이상 부모님 1명을 더했을 때 줄어드는 세금입니다. 총급여 3,000만 원은 15만 5,980원, 5,000만 원은 41만 2,500원, 8,000만 원은 66만 원입니다. 총급여 8,000만 원 자녀가 5,000만 원 자녀 대신 받으면 24만 7,500원을 더 아낍니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">누가 받느냐로 달라지는 세금</text>
    <text x="32" y="88" font-size="17" fill="#475569">70세 이상 부모님 1명 · 지방소득세 포함</text>

    <text x="32" y="146" font-size="19" font-weight="700" fill="#0f172a">총급여 3,000만 원</text>
    <rect x="32" y="160" width="76" height="42" rx="8" fill="#93c5fd"/>
    <text x="122" y="189" font-size="20" font-weight="800" fill="#1e3a8a">15만 5,980원</text>

    <text x="32" y="250" font-size="19" font-weight="700" fill="#0f172a">총급여 5,000만 원 (세율 15%)</text>
    <rect x="32" y="264" width="200" height="42" rx="8" fill="#3b82f6"/>
    <text x="246" y="293" font-size="20" font-weight="800" fill="#1e3a8a">41만 2,500원</text>

    <text x="32" y="354" font-size="19" font-weight="700" fill="#0f172a">총급여 8,000만 원 (세율 24%)</text>
    <rect x="32" y="368" width="320" height="42" rx="8" fill="#1d4ed8"/>
    <text x="366" y="397" font-size="20" font-weight="800" fill="#1e3a8a">66만 원</text>

    <rect x="32" y="438" width="496" height="58" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="280" y="474" font-size="18" font-weight="800" fill="#065f46" text-anchor="middle">8,000만 원 자녀가 받으면 24만 7,500원 더 아낌</text>
  </g>
</svg>
