<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
  <title id="t">배당 받는 날짜 흐름</title>
  <desc id="d">국내 주식은 배당기준일 2영업일 전까지 사야 배당을 받습니다. 기준일 1영업일 전이 배당락일로, 이날부터 사면 이번 배당은 받지 못합니다. 기준일에 주주명부가 확정되고, 배당 결정 뒤 한 달 안에 계좌로 입금됩니다.</desc>
  <rect x="0" y="0" width="560" height="560" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">배당, 언제까지 사야 할까</text>
    <text x="32" y="88" font-size="18" fill="#475569">국내 주식 · 사고 2영업일 뒤 결제</text>

    <line x1="62" y1="128" x2="62" y2="436" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <circle cx="62" cy="136" r="20" fill="#16a34a"/>
    <text x="62" y="143" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <text x="98" y="132" font-size="21" font-weight="800" fill="#166534">기준일 2영업일 전</text>
    <text x="98" y="158" font-size="16" fill="#475569">이날까지 사야 이번 배당을 받아요</text>

    <circle cx="62" cy="236" r="20" fill="#f59e0b"/>
    <text x="62" y="243" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <text x="98" y="232" font-size="21" font-weight="800" fill="#92400e">배당락일 (1영업일 전)</text>
    <text x="98" y="258" font-size="16" fill="#475569">이날부터 사면 이번 배당은 없음</text>
    <text x="98" y="282" font-size="16" fill="#475569">주가도 보통 배당만큼 낮게 시작</text>

    <circle cx="62" cy="336" r="20" fill="#3b82f6"/>
    <text x="62" y="343" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <text x="98" y="332" font-size="21" font-weight="800" fill="#0f172a">배당기준일</text>
    <text x="98" y="358" font-size="16" fill="#475569">주주명부에 이름이 오르는 날</text>

    <circle cx="62" cy="436" r="20" fill="#3b82f6"/>
    <text x="62" y="443" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
    <text x="98" y="432" font-size="21" font-weight="800" fill="#0f172a">계좌로 입금</text>
    <text x="98" y="458" font-size="16" fill="#475569">배당 결정 뒤 한 달 안에</text>

    <rect x="32" y="482" width="496" height="58" rx="12" fill="#e0f2fe"/>
    <text x="52" y="508" font-size="16" font-weight="800" fill="#075985">기준일은 회사마다 달라요</text>
    <text x="52" y="530" font-size="16" fill="#075985">사기 전에 배당 공시에서 날짜를 확인하세요</text>
  </g>
</svg>
