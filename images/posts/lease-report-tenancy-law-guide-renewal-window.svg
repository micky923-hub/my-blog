<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">계약갱신청구권을 쓸 수 있는 기간</title>
  <desc id="d">계약 만료가 2027년 3월 31일이면, 만료 6개월 전인 2026년 10월 1일부터 2개월 전인 2027년 1월 31일까지 갱신을 요구할 수 있습니다. 2027년 2월 이후에는 갱신청구권을 쓸 수 없습니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">갱신 요구는 이 창 안에서</text>
    <text x="32" y="88" font-size="18" fill="#475569">만료 2027년 3월 31일 계약의 예</text>

    <line x1="62" y1="140" x2="62" y2="380" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <rect x="52" y="146" width="20" height="134" rx="10" fill="#16a34a"/>

    <circle cx="62" cy="146" r="20" fill="#16a34a"/>
    <text x="62" y="153" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">6</text>
    <text x="98" y="142" font-size="21" font-weight="800" fill="#166534">2026. 10. 1 · 창이 열림</text>
    <text x="98" y="168" font-size="16" fill="#475569">만료 6개월 전부터 요구할 수 있어요</text>

    <circle cx="62" cy="280" r="20" fill="#16a34a"/>
    <text x="62" y="287" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
    <text x="98" y="276" font-size="21" font-weight="800" fill="#166534">2027. 1. 31 · 마지막 날</text>
    <text x="98" y="302" font-size="16" fill="#475569">만료 2개월 전까지 집주인에게 도착</text>

    <circle cx="62" cy="380" r="20" fill="#dc2626"/>
    <text x="62" y="387" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">✕</text>
    <text x="98" y="376" font-size="21" font-weight="800" fill="#991b1b">2027. 2월 이후 · 늦음</text>
    <text x="98" y="402" font-size="16" fill="#475569">갱신청구권을 쓸 수 없어요</text>

    <rect x="32" y="430" width="496" height="66" rx="12" fill="#dcfce7"/>
    <text x="52" y="460" font-size="18" font-weight="800" fill="#166534">문자·내용증명으로 기록을 남기세요</text>
    <text x="52" y="484" font-size="16" fill="#166534">한 번 쓰면 계약이 2년 늘어나요</text>
  </g>
</svg>
