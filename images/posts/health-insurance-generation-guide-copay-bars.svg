<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">비중증 비급여 진료비 100만 원의 세대별 내 부담</title>
  <desc id="d">비중증 비급여 진료비 100만 원을 냈을 때, 최소 공제금액을 빼고 단순 계산하면 2세대(20% 계약 가정)는 20만 원, 4세대는 30만 원, 5세대는 50만 원을 내가 부담합니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">같은 100만 원, 내 부담은?</text>
    <text x="32" y="90" font-size="18" fill="#475569">비중증 비급여 진료비 · 단순 계산</text>

    <text x="32" y="146" font-size="20" font-weight="700" fill="#0f172a">2세대 <tspan font-size="16" font-weight="400" fill="#475569">(20% 계약 가정)</tspan></text>
    <rect x="32" y="158" width="88" height="48" rx="8" fill="#16a34a"/>
    <text x="134" y="190" font-size="20" font-weight="800" fill="#166534">20만 원</text>

    <text x="32" y="254" font-size="20" font-weight="700" fill="#0f172a">4세대 <tspan font-size="16" font-weight="400" fill="#475569">(30%)</tspan></text>
    <rect x="32" y="266" width="132" height="48" rx="8" fill="#f59e0b"/>
    <text x="178" y="298" font-size="20" font-weight="800" fill="#92400e">30만 원</text>

    <text x="32" y="362" font-size="20" font-weight="700" fill="#0f172a">5세대 <tspan font-size="16" font-weight="400" fill="#475569">(50%)</tspan></text>
    <rect x="32" y="374" width="220" height="48" rx="8" fill="#ef4444"/>
    <text x="266" y="406" font-size="20" font-weight="800" fill="#b91c1c">50만 원</text>

    <rect x="32" y="440" width="496" height="44" rx="12" fill="#e0f2fe"/>
    <text x="52" y="468" font-size="16" font-weight="700" fill="#075985">2세대와 5세대 차이 30만 원 · 1년 몇 번인지 세세요</text>
  </g>
</svg>
