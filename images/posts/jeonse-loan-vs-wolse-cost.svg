<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" aria-labelledby="t d">
  <title id="t">전세대출 이자와 월세 1년 실제 부담 비교</title>
  <desc id="d">같은 집을 전세 3억 원(대출 2억 원)으로 들어가거나 보증금 1억 원에 월세 80만 원으로 들어갈 때, 총급여 5,000만 원 직장인의 세금 혜택을 뺀 1년 부담입니다. 전세대출 금리 3%면 약 560만 원, 4%면 약 747만 원, 5%면 약 934만 원이고, 월세는 약 780만 원입니다. 금리가 약 4.2%보다 낮으면 전세가 유리합니다.</desc>
  <rect x="0" y="0" width="560" height="540" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">1년 실제 부담, 누가 더 적을까</text>
    <text x="32" y="88" font-size="17" fill="#475569">전세 3억(대출 2억) vs 보증금 1억 + 월세 80만</text>
    <text x="32" y="112" font-size="17" fill="#475569">총급여 5,000만 원 · 세금 혜택 반영</text>

    <text x="32" y="160" font-size="19" font-weight="700" fill="#0f172a">전세대출 금리 3%</text>
    <rect x="32" y="170" width="228" height="40" rx="8" fill="#3b82f6"/>
    <text x="248" y="197" text-anchor="end" font-size="19" font-weight="800" fill="#ffffff">약 560만 원</text>

    <text x="32" y="250" font-size="19" font-weight="700" fill="#0f172a">전세대출 금리 4%</text>
    <rect x="32" y="260" width="304" height="40" rx="8" fill="#3b82f6"/>
    <text x="324" y="287" text-anchor="end" font-size="19" font-weight="800" fill="#ffffff">약 747만 원</text>

    <text x="32" y="340" font-size="19" font-weight="700" fill="#0f172a">전세대출 금리 5%</text>
    <rect x="32" y="350" width="380" height="40" rx="8" fill="#94a3b8"/>
    <text x="424" y="377" font-size="19" font-weight="800" fill="#334155">약 934만 원</text>

    <text x="32" y="430" font-size="19" font-weight="700" fill="#0f172a">월세 80만 원</text>
    <rect x="32" y="440" width="317" height="40" rx="8" fill="#f59e0b"/>
    <text x="361" y="467" font-size="19" font-weight="800" fill="#92400e">약 780만 원</text>
    <line x1="349" y1="148" x2="349" y2="488" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 6"/>

    <rect x="32" y="496" width="496" height="34" rx="10" fill="#dcfce7"/>
    <text x="280" y="519" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">대출 금리가 약 4.2%보다 낮으면 전세가 유리</text>
  </g>
</svg>
