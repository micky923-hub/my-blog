<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
  <title id="t">이번 주 코스피 종가 흐름</title>
  <desc id="d">코스피는 지난주 금요일 10월 30일 5,730.74에서 11월 5일 5,383.80, 11월 6일 5,059.69로 내렸습니다. 6일 하루 하락률은 6.02%이고, 한 주 전체로는 11.71% 내렸습니다.</desc>
  <rect x="0" y="0" width="560" height="420" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">한 주 만에 11.71% ↓</text>
    <text x="32" y="88" font-size="17" fill="#475569">코스피 종가 · 2026년 10월 30일~11월 6일</text>

    <line x1="32" y1="340" x2="528" y2="340" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="60" y="159" width="110" height="181" rx="8" fill="#93c5fd"/>
    <text x="115" y="145" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">5,730.74</text>
    <text x="115" y="368" text-anchor="middle" font-size="17" fill="#334155">10/30(지난주)</text>

    <rect x="225" y="215" width="110" height="125" rx="8" fill="#60a5fa"/>
    <text x="280" y="201" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">5,383.80</text>
    <text x="280" y="368" text-anchor="middle" font-size="17" fill="#334155">11/5(목)</text>

    <rect x="390" y="266" width="110" height="74" rx="8" fill="#ea580c"/>
    <text x="445" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#9a3412">5,059.69</text>
    <text x="445" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">11/6 6.02%↓</text>

    <text x="32" y="402" font-size="15" fill="#475569">6일 오전 9시 3분 1단계 서킷브레이커 발동(장중 4,924.61)</text>
  </g>
</svg>
