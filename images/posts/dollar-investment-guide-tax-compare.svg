<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 516" role="img" aria-labelledby="t d">
  <title id="t">환차익 500만 원일 때 방법별 세금</title>
  <desc id="d">5만 달러를 환율 1,400원에 사서 1,500원에 팔아 환차익 500만 원이 생기면, 달러예금은 환차익 비과세로 0원, 해외 상장 ETF는 250만 원을 뺀 250만 원의 22%인 55만 원, 국내 상장 달러ETF는 일반 계좌에서 15.4%인 77만 원을 냅니다.</desc>
  <rect x="0" y="0" width="560" height="516" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">환차익 500만 원, 다른 세금</text>
    <text x="32" y="90" font-size="18" fill="#475569">5만 달러 · 1,400원 → 1,500원 · 단순 계산</text>

    <text x="32" y="140" font-size="20" font-weight="700" fill="#0f172a">달러예금</text>
    <text x="32" y="166" font-size="16" fill="#475569">개인의 환차익은 비과세</text>
    <rect x="32" y="178" width="6" height="44" rx="3" fill="#16a34a"/>
    <text x="52" y="208" font-size="20" font-weight="800" fill="#166534">0원</text>

    <text x="32" y="262" font-size="20" font-weight="700" fill="#0f172a">해외 상장 ETF</text>
    <text x="32" y="288" font-size="16" fill="#475569">250만 원 공제 · 250만 원 × 22%</text>
    <rect x="32" y="300" width="314" height="44" rx="8" fill="#f59e0b"/>
    <text x="189" y="330" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">55만 원</text>

    <text x="32" y="384" font-size="20" font-weight="700" fill="#0f172a">국내 상장 달러ETF (일반 계좌)</text>
    <text x="32" y="410" font-size="16" fill="#475569">500만 원 × 15.4%</text>
    <rect x="32" y="422" width="440" height="44" rx="8" fill="#94a3b8"/>
    <text x="252" y="452" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">77만 원</text>
  </g>
</svg>
