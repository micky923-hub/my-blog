<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">7만 원 진료에서 돌려받는 실손보험금</title>
  <desc id="d">4세대 실손 기준 동네 의원 통원 1회에 급여 2만 원을 내면 최소 공제 1만 원을 빼고 1만 원, 비급여 5만 원을 내면 최소 공제 3만 원을 빼고 2만 원을 돌려받아 합계 3만 원입니다. 같은 진료를 한 달 두 번씩 1년 받으면 72만 원입니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">7만 원 내고 3만 원 돌려받기</text>
    <text x="32" y="90" font-size="18" fill="#475569">4세대 실손 · 동네 의원 통원 1회 가정</text>

    <text x="32" y="142" font-size="20" font-weight="700" fill="#0f172a">급여 2만 원 <tspan font-size="16" font-weight="400" fill="#475569">(공제 1만 원)</tspan></text>
    <rect x="32" y="156" width="60" height="44" rx="8" fill="#cbd5e1"/>
    <rect x="92" y="156" width="60" height="44" rx="8" fill="#16a34a"/>
    <text x="166" y="186" font-size="20" font-weight="800" fill="#166534">받는 돈 1만 원</text>

    <text x="32" y="248" font-size="20" font-weight="700" fill="#0f172a">비급여 5만 원 <tspan font-size="16" font-weight="400" fill="#475569">(공제 3만 원)</tspan></text>
    <rect x="32" y="262" width="180" height="44" rx="8" fill="#cbd5e1"/>
    <rect x="212" y="262" width="120" height="44" rx="8" fill="#16a34a"/>
    <text x="346" y="292" font-size="20" font-weight="800" fill="#166534">2만 원</text>

    <rect x="32" y="326" width="18" height="18" rx="4" fill="#cbd5e1"/>
    <text x="58" y="341" font-size="16" fill="#475569">내 부담(공제)</text>
    <rect x="200" y="326" width="18" height="18" rx="4" fill="#16a34a"/>
    <text x="226" y="341" font-size="16" fill="#475569">돌려받는 돈</text>

    <rect x="32" y="364" width="496" height="56" rx="12" fill="#dcfce7"/>
    <text x="52" y="400" font-size="21" font-weight="800" fill="#166534">1회 합계 3만 원 · 월 2회×1년 72만 원</text>

    <rect x="32" y="436" width="496" height="44" rx="12" fill="#e0f2fe"/>
    <text x="52" y="464" font-size="16" font-weight="700" fill="#075985">소액이라 넘기면 이만큼을 버리는 셈입니다</text>
  </g>
</svg>
