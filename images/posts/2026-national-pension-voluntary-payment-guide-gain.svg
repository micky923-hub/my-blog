<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">추납 개월 수별로 늘어나는 월 연금 어림값</title>
  <desc id="d">A값 300만 원, 내 평균소득 200만 원으로 가정하면 추납 12개월은 월 약 2만 7천 원, 36개월은 약 8만 1천 원, 60개월은 약 13만 4천 원, 119개월은 약 26만 7천 원의 연금이 늘어납니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f0fdf4"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">채운 만큼 늘어나는 월 연금</text>
    <text x="32" y="88" font-size="17" fill="#475569">A값 300만·내 소득 200만 원 가정, 어림값</text>

    <text x="32" y="138" font-size="18" font-weight="700" fill="#0f172a">12개월 추납</text>
    <text x="528" y="138" text-anchor="end" font-size="16" fill="#64748b">보험료 228만</text>
    <rect x="32" y="150" width="48" height="40" rx="8" fill="#86efac"/>
    <text x="92" y="177" font-size="20" font-weight="800" fill="#166534">약 2만 7천 원</text>

    <text x="32" y="232" font-size="18" font-weight="700" fill="#0f172a">36개월 추납</text>
    <text x="528" y="232" text-anchor="end" font-size="16" fill="#64748b">보험료 684만</text>
    <rect x="32" y="244" width="143" height="40" rx="8" fill="#4ade80"/>
    <text x="187" y="271" font-size="20" font-weight="800" fill="#166534">약 8만 1천 원</text>

    <text x="32" y="326" font-size="18" font-weight="700" fill="#0f172a">60개월 추납</text>
    <text x="528" y="326" text-anchor="end" font-size="16" fill="#64748b">보험료 1,140만</text>
    <rect x="32" y="338" width="238" height="40" rx="8" fill="#22c55e"/>
    <text x="282" y="365" font-size="20" font-weight="800" fill="#166534">약 13만 4천 원</text>

    <text x="32" y="420" font-size="18" font-weight="700" fill="#0f172a">119개월 추납</text>
    <text x="528" y="420" text-anchor="end" font-size="16" fill="#64748b">보험료 2,261만</text>
    <rect x="32" y="432" width="473" height="40" rx="8" fill="#16a34a"/>
    <text x="493" y="459" text-anchor="end" font-size="20" font-weight="800" fill="#ffffff">약 26만 7천 원</text>
  </g>
</svg>
