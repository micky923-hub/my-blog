<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">60개월 추납 비용, 2026년과 2027년 비교</title>
  <desc id="d">기준소득월액 100만 원은 2026년 9.5%로 570만 원, 2027년 10%로 600만 원입니다. 200만 원은 1,140만 원과 1,200만 원, 300만 원은 1,710만 원과 1,800만 원으로 30만~90만 원 차이가 납니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#eff6ff"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">60개월 추납, 언제 내면 얼마</text>
    <text x="32" y="88" font-size="17" fill="#475569">지역·임의가입자 보험료율 기준</text>
    <rect x="32" y="108" width="18" height="18" rx="4" fill="#2563eb"/>
    <text x="58" y="123" font-size="16" fill="#334155">2026년 9.5%</text>
    <rect x="180" y="108" width="18" height="18" rx="4" fill="#94a3b8"/>
    <text x="206" y="123" font-size="16" fill="#334155">2027년 10%</text>

    <text x="32" y="170" font-size="18" font-weight="700" fill="#0f172a">기준소득월액 100만 원</text>
    <rect x="32" y="182" width="128" height="30" rx="7" fill="#2563eb"/>
    <text x="170" y="204" font-size="17" font-weight="800" fill="#1e3a8a">570만 원</text>
    <rect x="32" y="218" width="135" height="30" rx="7" fill="#94a3b8"/>
    <text x="177" y="240" font-size="17" font-weight="700" fill="#475569">600만 원</text>

    <text x="32" y="290" font-size="18" font-weight="700" fill="#0f172a">기준소득월액 200만 원</text>
    <rect x="32" y="302" width="256" height="30" rx="7" fill="#2563eb"/>
    <text x="298" y="324" font-size="17" font-weight="800" fill="#1e3a8a">1,140만 원</text>
    <rect x="32" y="338" width="269" height="30" rx="7" fill="#94a3b8"/>
    <text x="311" y="360" font-size="17" font-weight="700" fill="#475569">1,200만 원</text>

    <text x="32" y="410" font-size="18" font-weight="700" fill="#0f172a">기준소득월액 300만 원</text>
    <rect x="32" y="422" width="384" height="30" rx="7" fill="#2563eb"/>
    <text x="425" y="444" font-size="17" font-weight="800" fill="#1e3a8a">1,710만</text>
    <rect x="32" y="458" width="404" height="30" rx="7" fill="#94a3b8"/>
    <text x="446" y="480" font-size="17" font-weight="700" fill="#475569">1,800만</text>
  </g>
</svg>
