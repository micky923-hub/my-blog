<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">월 20만 원을 언제부터 모으느냐에 따라 대학 입학 때 모이는 돈</title>
  <desc id="d">월 20만 원을 연 4% 복리로 모은다고 가정하면 태어나서 바로 시작해 18년 모으면 약 6,312만 원, 초등학교 입학 때 시작해 11년 모으면 약 3,309만 원, 중학교 입학 때 시작해 5년 모으면 약 1,326만 원이 됩니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">월 20만 원, 언제 시작할까</text>
    <text x="32" y="88" font-size="17" fill="#475569">연 4% 복리 가정(세금 전) · 대학 입학 때 금액</text>

    <text x="32" y="140" font-size="20" font-weight="700" fill="#0f172a">태어나자마자 (18년)</text>
    <rect x="32" y="152" width="360" height="44" rx="8" fill="#16a34a"/>
    <text x="406" y="182" font-size="21" font-weight="800" fill="#14532d">6,312만</text>
    <text x="32" y="220" font-size="16" fill="#64748b">넣은 돈 4,320만 원</text>

    <text x="32" y="270" font-size="20" font-weight="700" fill="#0f172a">초등 입학 때 (11년)</text>
    <rect x="32" y="282" width="189" height="44" rx="8" fill="#f59e0b"/>
    <text x="235" y="312" font-size="21" font-weight="800" fill="#92400e">3,309만</text>
    <text x="32" y="350" font-size="16" fill="#64748b">넣은 돈 2,640만 원</text>

    <text x="32" y="400" font-size="20" font-weight="700" fill="#0f172a">중학 입학 때 (5년)</text>
    <rect x="32" y="412" width="76" height="44" rx="8" fill="#dc2626"/>
    <text x="122" y="442" font-size="21" font-weight="800" fill="#7f1d1d">1,326만</text>
    <text x="270" y="442" font-size="16" fill="#64748b">넣은 돈 1,200만 원</text>

    <rect x="32" y="470" width="496" height="36" rx="10" fill="#dcfce7"/>
    <text x="48" y="494" font-size="16" font-weight="800" fill="#166534">같은 월 20만 원도 일찍 시작하면 두 배 가까이</text>
  </g>
</svg>
