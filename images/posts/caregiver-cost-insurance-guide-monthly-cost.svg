<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t d">
  <title id="t">간병 방식별 한 달 부담</title>
  <desc id="d">30일 기준으로 개인 간병인은 약 370만 원, 요양병원 공동간병은 60만~90만 원, 간호·간병통합서비스 병동은 하루 2만 2,000원으로 약 66만 원을 냅니다.</desc>
  <rect x="0" y="0" width="560" height="460" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">간병 방식별 한 달 부담</text>
    <text x="32" y="88" font-size="17" fill="#475569">30일 입원 기준 · 2026년 10월 기준</text>

    <text x="32" y="142" font-size="18" font-weight="700" fill="#0f172a">개인 간병인</text>
    <rect x="32" y="154" width="496" height="44" rx="8" fill="#ea580c"/>
    <text x="514" y="183" text-anchor="end" font-size="20" font-weight="800" fill="#ffffff">약 370만 원</text>

    <text x="32" y="246" font-size="18" font-weight="700" fill="#0f172a">공동간병 (요양병원)</text>
    <rect x="32" y="258" width="80" height="44" rx="8" fill="#fb923c"/>
    <rect x="112" y="258" width="41" height="44" rx="8" fill="#fdba74"/>
    <text x="166" y="287" font-size="20" font-weight="800" fill="#9a3412">60만~90만 원</text>

    <text x="32" y="350" font-size="18" font-weight="700" fill="#0f172a">간호·간병통합서비스 병동</text>
    <rect x="32" y="362" width="88" height="44" rx="8" fill="#0d9488"/>
    <text x="134" y="391" font-size="20" font-weight="800" fill="#115e59">약 66만 원 (하루 2만 2,000원)</text>

    <text x="32" y="440" font-size="15" fill="#475569">통합서비스 병동 금액은 입원료를 포함한 값이에요</text>
  </g>
</svg>
