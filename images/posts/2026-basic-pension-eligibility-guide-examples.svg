<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">예시 세 가구의 소득인정액과 선정기준액 비교</title>
  <desc id="d">A씨 단독 약 108만 원은 기준 247만 원 아래로 월 34만 9,700원, B씨 부부 183만 8,000원은 기준 395만 2,000원 아래로 합계 월 55만 9,520원, C씨 단독 약 312만 원은 247만 원을 넘어 대상이 아닙니다.</desc>
  <rect x="0" y="0" width="560" height="520" rx="22" fill="#eff6ff"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">세 가구, 기준선 안일까</text>
    <text x="32" y="88" font-size="17" fill="#475569">막대: 소득인정액 / 회색: 선정기준액</text>

    <text x="32" y="140" font-size="18" font-weight="700" fill="#0f172a">A씨 단독 · 집 3억 · 연금 50만</text>
    <rect x="32" y="152" width="320" height="30" rx="7" fill="#cbd5e1"/>
    <rect x="32" y="152" width="140" height="30" rx="7" fill="#2563eb"/>
    <text x="182" y="174" font-size="17" font-weight="800" fill="#1e3a8a">약 108만</text>
    <text x="362" y="174" font-size="16" fill="#475569">기준 247만</text>
    <text x="32" y="210" font-size="17" font-weight="700" fill="#15803d">대상 · 월 34만 9,700원</text>

    <text x="32" y="270" font-size="18" font-weight="700" fill="#0f172a">B씨 부부 · 집 4억 · 연금 45만</text>
    <rect x="32" y="282" width="400" height="30" rx="7" fill="#cbd5e1"/>
    <rect x="32" y="282" width="186" height="30" rx="7" fill="#2563eb"/>
    <text x="226" y="304" font-size="17" font-weight="800" fill="#1e3a8a">183.8만</text>
    <text x="442" y="304" font-size="16" fill="#475569">395.2만</text>
    <text x="32" y="340" font-size="17" font-weight="700" fill="#15803d">대상 · 부부 월 55만 9,520원</text>

    <text x="32" y="400" font-size="18" font-weight="700" fill="#0f172a">C씨 단독 · 집 8억 · 연금 80만</text>
    <rect x="32" y="412" width="404" height="30" rx="7" fill="#ef4444"/>
    <rect x="32" y="412" width="320" height="30" rx="7" fill="#cbd5e1" fill-opacity="0.55"/>
    <line x1="352" y1="404" x2="352" y2="450" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="446" y="434" font-size="17" font-weight="800" fill="#b91c1c">약 312만</text>
    <text x="32" y="470" font-size="17" font-weight="700" fill="#b91c1c">기준 247만 원을 넘어 대상 아님</text>
  </g>
</svg>
