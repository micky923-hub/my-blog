<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
  <title id="t">기초연금 소득인정액 계산 순서</title>
  <desc id="d">근로소득은 116만 원을 빼고 70%를 반영하고, 국민연금 같은 다른 소득은 그대로 더하며, 재산은 기본재산액과 금융재산 2,000만 원을 빼고 부채를 뺀 뒤 4%를 곱해 12로 나눕니다. 세 칸을 더한 소득인정액이 단독 247만 원, 부부 395만 2,000원 이하이면 대상입니다.</desc>
  <rect x="0" y="0" width="560" height="560" rx="22" fill="#f0fdf4"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">소득인정액, 세 칸을 더하세요</text>
    <text x="32" y="88" font-size="17" fill="#475569">본인과 배우자 것을 모두 더합니다 (2026년)</text>

    <rect x="32" y="112" width="496" height="88" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="52" y="146" font-size="19" font-weight="800" fill="#166534">① 근로소득</text>
    <text x="52" y="180" font-size="17" fill="#334155">(월 근로소득 − 116만 원) × 70%</text>

    <rect x="32" y="214" width="496" height="88" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="52" y="248" font-size="19" font-weight="800" fill="#166534">② 그 밖의 소득</text>
    <text x="52" y="282" font-size="17" fill="#334155">국민연금·사업소득 등은 그대로 더하기</text>

    <rect x="32" y="316" width="496" height="112" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="52" y="350" font-size="19" font-weight="800" fill="#166534">③ 재산</text>
    <text x="52" y="382" font-size="17" fill="#334155">(집 − 기본재산액) + (예금 − 2,000만)</text>
    <text x="52" y="410" font-size="17" fill="#334155">− 부채, 여기에 × 4% ÷ 12</text>

    <rect x="32" y="446" width="496" height="86" rx="14" fill="#16a34a"/>
    <text x="52" y="481" font-size="20" font-weight="800" fill="#ffffff">①+②+③ ≤ 단독 247만 원</text>
    <text x="52" y="513" font-size="18" font-weight="700" fill="#dcfce7">부부 395만 2,000원이면 대상</text>
  </g>
</svg>
