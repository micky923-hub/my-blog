<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 616" role="img" aria-labelledby="t d">
  <title id="t">하락률과 회복에 필요한 상승률</title>
  <desc id="d">떨어진 만큼 회복하려면 더 크게 올라야 합니다. 20% 하락은 25% 상승, 40% 하락은 약 67% 상승, 50% 하락은 100% 상승이 있어야 본전입니다. 1,000만 원이 40% 빠지면 600만 원이 됩니다.</desc>
  <rect x="0" y="0" width="560" height="616" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">떨어진 만큼보다 더 올라야 해요</text>
    <text x="32" y="90" font-size="18" fill="#475569">빨강: 하락률 · 초록: 본전까지 필요한 상승률</text>

    <text x="32" y="140" font-size="20" font-weight="700" fill="#0f172a">20% 떨어지면</text>
    <rect x="32" y="154" width="80" height="34" rx="7" fill="#f87171"/>
    <text x="124" y="178" font-size="18" font-weight="800" fill="#b91c1c">−20%</text>
    <rect x="32" y="196" width="100" height="34" rx="7" fill="#16a34a"/>
    <text x="144" y="220" font-size="18" font-weight="800" fill="#166534">+25% 올라야 본전</text>

    <text x="32" y="270" font-size="20" font-weight="700" fill="#0f172a">40% 떨어지면</text>
    <rect x="32" y="284" width="160" height="34" rx="7" fill="#f87171"/>
    <text x="204" y="308" font-size="18" font-weight="800" fill="#b91c1c">−40%</text>
    <rect x="32" y="326" width="267" height="34" rx="7" fill="#16a34a"/>
    <text x="166" y="350" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">+약 67% 올라야 본전</text>

    <text x="32" y="400" font-size="20" font-weight="700" fill="#0f172a">50% 떨어지면</text>
    <rect x="32" y="414" width="200" height="34" rx="7" fill="#f87171"/>
    <text x="244" y="438" font-size="18" font-weight="800" fill="#b91c1c">−50%</text>
    <rect x="32" y="456" width="400" height="34" rx="7" fill="#16a34a"/>
    <text x="232" y="480" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">+100% 올라야 본전</text>

    <rect x="32" y="516" width="496" height="80" rx="12" fill="#fef3c7"/>
    <text x="52" y="546" font-size="18" font-weight="800" fill="#92400e">1,000만 원이 40% 빠지면 600만 원</text>
    <text x="52" y="574" font-size="16" fill="#92400e">버틸 수 있는 금액만 넣으세요</text>
  </g>
</svg>
