<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">신용카드 3,000만 원, 누구 카드로 쓸까</title>
  <desc id="d">총급여 8,000만 원 아내와 4,000만 원 남편이 신용카드로 연 3,000만 원을 쓸 때, 반반 나눠 쓰면 세금이 약 12만 4천 원, 아내에게 몰면 약 39만 6천 원, 남편에게 몰면 약 49만 5천 원 줄어듭니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">카드 3,000만 원, 누구 카드로?</text>
    <text x="32" y="90" font-size="18" fill="#475569">아내 총급여 8천만 · 남편 4천만 · 신용카드 15%</text>

    <text x="32" y="146" font-size="20" font-weight="700" fill="#0f172a">반반 나눠 쓰기 <tspan font-size="17" font-weight="400" fill="#475569">· 75만 원 공제</tspan></text>
    <rect x="32" y="158" width="100" height="48" rx="8" fill="#94a3b8"/>
    <text x="146" y="190" font-size="20" font-weight="800" fill="#0f172a">약 12만 4천 원↓</text>

    <text x="32" y="254" font-size="20" font-weight="700" fill="#0f172a">아내에게 몰기 <tspan font-size="17" font-weight="400" fill="#475569">· 150만 원 공제</tspan></text>
    <rect x="32" y="266" width="320" height="48" rx="8" fill="#60a5fa"/>
    <text x="192" y="298" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">약 39만 6천 원↓</text>

    <text x="32" y="362" font-size="20" font-weight="700" fill="#0f172a">남편에게 몰기 <tspan font-size="17" font-weight="400" fill="#475569">· 300만 원 공제</tspan></text>
    <rect x="32" y="374" width="400" height="48" rx="8" fill="#2563eb"/>
    <text x="232" y="406" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">약 49만 5천 원↓</text>

    <rect x="32" y="438" width="496" height="44" rx="12" fill="#dcfce7"/>
    <text x="52" y="467" font-size="18" font-weight="700" fill="#14532d">문턱 낮은 쪽에 모으면 반반보다 약 37만 원 이득</text>
  </g>
</svg>
