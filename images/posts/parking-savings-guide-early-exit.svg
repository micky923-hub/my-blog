<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="t d">
  <title id="t">1,000만 원을 6개월 뒤 꺼낼 때 세후 이자</title>
  <desc id="d">예시 금리로 1,000만 원을 6개월 뒤 꺼내면 세후 이자는 6개월 만기 정기예금(연 2.8%) 11만 8,440원, 파킹통장(연 2%) 8만 4,600원, 1년 정기예금을 6개월에 중도해지(연 0.5% 적용)하면 2만 1,150원입니다.</desc>
  <rect x="0" y="0" width="560" height="470" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">6개월 뒤 꺼낼 돈이라면</text>
    <text x="32" y="88" font-size="18" fill="#475569">1,000만 원 · 세후 이자 · 예시 금리</text>

    <text x="32" y="140" font-size="20" font-weight="700" fill="#0f172a">6개월 만기 예금 <tspan font-weight="400" fill="#475569">연 2.8%</tspan></text>
    <rect x="32" y="152" width="360" height="40" rx="8" fill="#16a34a"/>
    <text x="402" y="179" font-size="19" font-weight="800" fill="#166534">11만 8,440원</text>

    <text x="32" y="240" font-size="20" font-weight="700" fill="#0f172a">파킹통장 <tspan font-weight="400" fill="#475569">연 2%</tspan></text>
    <rect x="32" y="252" width="257" height="40" rx="8" fill="#60a5fa"/>
    <text x="299" y="279" font-size="19" font-weight="800" fill="#1e3a8a">8만 4,600원</text>

    <text x="32" y="340" font-size="20" font-weight="700" fill="#0f172a">1년 예금 중도해지 <tspan font-weight="400" fill="#475569">연 0.5% 적용</tspan></text>
    <rect x="32" y="352" width="64" height="40" rx="8" fill="#f87171"/>
    <text x="106" y="379" font-size="19" font-weight="800" fill="#991b1b">2만 1,150원</text>

    <rect x="32" y="410" width="496" height="44" rx="12" fill="#e0f2fe"/>
    <text x="52" y="439" font-size="17" fill="#075985"><tspan font-weight="800">쓸 날짜에 맞춘 만기</tspan>로 가입하세요</text>
  </g>
</svg>
