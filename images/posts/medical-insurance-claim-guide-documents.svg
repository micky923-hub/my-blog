<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">통원 진료비 금액별 실손보험 청구 서류</title>
  <desc id="d">실손24에 연계되지 않은 병원에서 통원 진료비가 3만 원 이하면 진료비 영수증만, 3만 원 초과 10만 원 이하면 질병분류기호가 적힌 처방전을 추가로, 10만 원을 넘으면 진단서·통원확인서·소견서 중 하나를 추가로 냅니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">진료비만큼만 서류를 챙기세요</text>
    <text x="32" y="90" font-size="18" fill="#475569">실손24 미연계 병원 · 통원 진료 기준</text>

    <rect x="32" y="120" width="496" height="88" rx="14" fill="#dcfce7"/>
    <text x="52" y="156" font-size="21" font-weight="800" fill="#166534">3만 원 이하</text>
    <text x="52" y="188" font-size="18" fill="#14532d">진료비 영수증</text>

    <rect x="32" y="224" width="496" height="88" rx="14" fill="#fef3c7"/>
    <text x="52" y="260" font-size="21" font-weight="800" fill="#92400e">3만 원 초과~10만 원 이하</text>
    <text x="52" y="292" font-size="18" fill="#78350f">영수증 + 질병분류기호 적힌 처방전</text>

    <rect x="32" y="328" width="496" height="88" rx="14" fill="#fee2e2"/>
    <text x="52" y="364" font-size="21" font-weight="800" fill="#b91c1c">10만 원 초과</text>
    <text x="52" y="396" font-size="18" fill="#7f1d1d">위 서류 + 진단서·통원확인서·소견서 중 하나</text>

    <rect x="32" y="436" width="496" height="44" rx="12" fill="#e0f2fe"/>
    <text x="52" y="464" font-size="16" font-weight="700" fill="#075985">비급여가 있으면 진료비 세부내역서도 함께 받으세요</text>
  </g>
</svg>
