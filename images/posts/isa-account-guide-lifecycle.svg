<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" role="img" aria-labelledby="t d">
  <title id="t">ISA 3년 흐름</title>
  <desc id="d">계좌를 만든 날부터 3년 의무가입 기간이 시작됩니다. 3년 동안 1년에 2,000만 원까지 넣을 수 있고 못 채운 한도는 다음 해로 넘어갑니다. 3년 전 해지하면 세금 혜택을 돌려내야 합니다. 만기가 되면 60일 안에 연금계좌로 옮기거나, 새 ISA에 다시 가입하거나, 만기를 늘려 계속 굴립니다.</desc>
  <rect x="0" y="0" width="560" height="580" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">ISA 3년, 이렇게 흘러가요</text>
    <text x="32" y="88" font-size="18" fill="#475569">3년은 계좌를 만든 날부터 세요</text>

    <line x1="62" y1="138" x2="62" y2="358" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <circle cx="62" cy="146" r="20" fill="#3b82f6"/>
    <text x="62" y="153" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <text x="98" y="142" font-size="21" font-weight="800" fill="#0f172a">계좌 만든 날</text>
    <text x="98" y="168" font-size="16" fill="#475569">의무가입 3년이 이날부터 시작</text>

    <circle cx="62" cy="246" r="20" fill="#3b82f6"/>
    <text x="62" y="253" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <text x="98" y="242" font-size="21" font-weight="800" fill="#0f172a">3년 동안 모으기</text>
    <text x="98" y="268" font-size="16" fill="#475569">1년에 2,000만 원까지, 남은 한도는 이월</text>
    <text x="98" y="292" font-size="16" fill="#b91c1c">3년 전 해지하면 혜택을 돌려내요</text>

    <circle cx="62" cy="346" r="20" fill="#16a34a"/>
    <text x="62" y="353" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">✓</text>
    <text x="98" y="342" font-size="21" font-weight="800" fill="#166534">만기</text>
    <text x="98" y="368" font-size="16" fill="#475569">순이익 200만·400만 원 비과세, 나머지 9.9%</text>

    <rect x="32" y="400" width="496" height="156" rx="12" fill="#e0f2fe"/>
    <text x="52" y="432" font-size="18" font-weight="800" fill="#075985">만기 때 셋 중 하나를 고르세요</text>
    <text x="52" y="464" font-size="16" fill="#075985">① 60일 안에 연금계좌로: 최대 300만 원 추가 공제</text>
    <text x="52" y="494" font-size="16" fill="#075985">② 새 ISA 가입: 비과세 한도를 다시 사용</text>
    <text x="52" y="524" font-size="16" fill="#075985">③ 만기 연장: 그대로 계속 굴리기</text>
  </g>
</svg>
