<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
  <title id="t">재산 규모별 상속세, 배우자 유무 비교</title>
  <desc id="d">성년 자녀 2명, 빚 없음, 장례비 500만 원, 기한 안 신고 기준입니다. 재산 10억 원이면 배우자가 있을 때 0원, 자녀만 있을 때 8,633만 원입니다. 15억 원이면 8,633만 원과 약 2억 3,135만 원, 20억 원이면 약 2억 3,135만 원과 4억 2,486만 원입니다.</desc>
  <rect x="0" y="0" width="560" height="560" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">재산별 상속세 합계</text>
    <text x="32" y="88" font-size="17" fill="#475569">성년 자녀 2명 · 기한 안 신고 기준</text>
    <rect x="32" y="106" width="18" height="18" rx="4" fill="#3b82f6"/>
    <text x="58" y="121" font-size="16" fill="#334155">배우자 + 자녀</text>
    <rect x="196" y="106" width="18" height="18" rx="4" fill="#f59e0b"/>
    <text x="222" y="121" font-size="16" fill="#334155">자녀만</text>

    <text x="32" y="170" font-size="20" font-weight="700" fill="#0f172a">재산 10억 원</text>
    <rect x="32" y="182" width="4" height="30" rx="2" fill="#3b82f6"/>
    <text x="46" y="204" font-size="17" font-weight="800" fill="#0f172a">0원</text>
    <rect x="32" y="218" width="58" height="30" rx="6" fill="#f59e0b"/>
    <text x="100" y="240" font-size="17" font-weight="800" fill="#0f172a">8,633만 원</text>

    <text x="32" y="296" font-size="20" font-weight="700" fill="#0f172a">재산 15억 원</text>
    <rect x="32" y="308" width="58" height="30" rx="6" fill="#3b82f6"/>
    <text x="100" y="330" font-size="17" font-weight="800" fill="#0f172a">8,633만 원</text>
    <rect x="32" y="344" width="155" height="30" rx="6" fill="#f59e0b"/>
    <text x="197" y="366" font-size="17" font-weight="800" fill="#0f172a">약 2억 3,135만 원</text>

    <text x="32" y="422" font-size="20" font-weight="700" fill="#0f172a">재산 20억 원</text>
    <rect x="32" y="434" width="155" height="30" rx="6" fill="#3b82f6"/>
    <text x="197" y="456" font-size="17" font-weight="800" fill="#0f172a">약 2억 3,135만 원</text>
    <rect x="32" y="470" width="285" height="30" rx="6" fill="#f59e0b"/>
    <text x="327" y="492" font-size="17" font-weight="800" fill="#0f172a">4억 2,486만 원</text>

    <text x="32" y="538" font-size="16" fill="#475569">배우자가 있으면 기준선이 5억 원 높아요</text>
  </g>
</svg>
