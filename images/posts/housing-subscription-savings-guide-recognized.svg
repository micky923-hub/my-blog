<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
  <title id="t">월 납입액별 10년 공공분양 인정 금액</title>
  <desc id="d">10년 동안 매달 넣었을 때 공공분양 납입 인정 금액은 월 2만 원이면 240만 원, 월 10만 원이면 1,200만 원, 월 25만 원이면 3,000만 원입니다. 월 50만 원을 넣어 원금이 6,000만 원이 되어도 인정 금액은 3,000만 원이고 나머지 3,000만 원은 인정되지 않습니다.</desc>
  <rect x="0" y="0" width="560" height="560" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">10년 넣으면 인정 금액은?</text>
    <text x="32" y="88" font-size="18" fill="#475569">공공분양 기준 · 월 25만 원까지만 인정</text>

    <text x="32" y="138" font-size="20" font-weight="700" fill="#0f172a">월 2만 원</text>
    <rect x="32" y="150" width="19" height="40" rx="6" fill="#93c5fd"/>
    <text x="62" y="177" font-size="19" font-weight="800" fill="#1e3a8a">240만 원</text>

    <text x="32" y="236" font-size="20" font-weight="700" fill="#0f172a">월 10만 원</text>
    <rect x="32" y="248" width="96" height="40" rx="6" fill="#60a5fa"/>
    <text x="139" y="275" font-size="19" font-weight="800" fill="#1e3a8a">1,200만 원</text>

    <text x="32" y="334" font-size="20" font-weight="700" fill="#0f172a">월 25만 원</text>
    <rect x="32" y="346" width="240" height="40" rx="6" fill="#2563eb"/>
    <text x="283" y="373" font-size="19" font-weight="800" fill="#1e3a8a">3,000만 원</text>

    <text x="32" y="432" font-size="20" font-weight="700" fill="#0f172a">월 50만 원</text>
    <rect x="32" y="444" width="240" height="40" rx="6" fill="#2563eb"/>
    <rect x="273" y="445" width="238" height="38" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="152" y="471" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">인정 3,000만</text>
    <text x="392" y="471" text-anchor="middle" font-size="17" fill="#64748b">인정 안 됨 3,000만</text>

    <text x="32" y="526" font-size="17" fill="#0f172a">25만 원 넘는 돈은 <tspan font-weight="800">예치금·다른 저축</tspan>으로</text>
  </g>
</svg>
