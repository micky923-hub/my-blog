<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">갱신할 때와 새 집으로 옮길 때 보증금 비교</title>
  <desc id="d">지금 전세 3억 원 집을 갱신하면 5% 상한으로 최대 3억 1,500만 원입니다. 같은 동네 시세가 3억 6,000만 원으로 올랐다면 새 집으로 옮길 때 지금보다 6,000만 원, 갱신보다 4,500만 원을 더 마련해야 합니다.</desc>
  <rect x="0" y="0" width="560" height="500" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="28" font-weight="800" fill="#0f172a">갱신하면 5%까지만</text>
    <text x="32" y="88" font-size="18" fill="#475569">전세 3억 원 · 시세가 3억 6천만 원으로 올랐다면</text>

    <text x="32" y="142" font-size="20" font-weight="700" fill="#0f172a">지금 보증금</text>
    <rect x="32" y="154" width="330" height="44" rx="8" fill="#93c5fd"/>
    <text x="376" y="184" font-size="20" font-weight="800" fill="#1e3a8a">3억 원</text>

    <text x="32" y="240" font-size="20" font-weight="700" fill="#0f172a">갱신 (5% 상한)</text>
    <rect x="32" y="252" width="346" height="44" rx="8" fill="#3b82f6"/>
    <text x="392" y="282" font-size="20" font-weight="800" fill="#1e3a8a">3억 1,500만</text>

    <text x="32" y="338" font-size="20" font-weight="700" fill="#0f172a">새 집 (상한 없음)</text>
    <rect x="32" y="350" width="396" height="44" rx="8" fill="#f59e0b"/>
    <text x="230" y="380" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3억 6,000만</text>

    <rect x="32" y="418" width="496" height="60" rx="12" fill="#fef3c7"/>
    <text x="52" y="455" font-size="18" font-weight="800" fill="#92400e">갱신하면 4,500만 원 덜 마련해도 돼요</text>
  </g>
</svg>
