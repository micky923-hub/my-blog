<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t d">
  <title id="t">1,000만 원 예금, 세후 이자가 물가를 이길까</title>
  <desc id="d">1,000만 원을 1년 예금에 넣으면 세후 이자는 연 2.0%일 때 16만 9,200원, 3.0%일 때 25만 3,800원, 3.5%일 때 29만 6,100원입니다. 물가 2.9%만큼 값어치를 지키려면 29만 원이 필요해서 3.5%만 겨우 넘습니다.</desc>
  <rect x="0" y="0" width="560" height="460" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">세후 이자 vs 물가 2.9%</text>
    <text x="32" y="88" font-size="17" fill="#475569">1,000만 원 · 1년 예금 · 이자세 15.4% 뺀 금액</text>

    <line x1="457" y1="112" x2="457" y2="400" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>

    <text x="32" y="140" font-size="18" font-weight="700" fill="#0f172a">연 2.0% 예금</text>
    <rect x="32" y="152" width="248" height="44" rx="8" fill="#93c5fd"/>
    <text x="292" y="181" font-size="20" font-weight="800" fill="#1e3a8a">16만 9,200원</text>

    <text x="32" y="240" font-size="18" font-weight="700" fill="#0f172a">연 3.0% 예금</text>
    <rect x="32" y="252" width="372" height="44" rx="8" fill="#3b82f6"/>
    <text x="390" y="281" text-anchor="end" font-size="20" font-weight="800" fill="#ffffff">25만 3,800원</text>

    <text x="32" y="340" font-size="18" font-weight="700" fill="#0f172a">연 3.5% 예금</text>
    <rect x="32" y="352" width="434" height="44" rx="8" fill="#1d4ed8"/>
    <text x="440" y="381" text-anchor="end" font-size="20" font-weight="800" fill="#ffffff">29만 6,100원</text>

    <text x="32" y="434" font-size="16" font-weight="700" fill="#dc2626">빨간 점선 = 물가 2.9%만큼 필요한 29만 원</text>
  </g>
</svg>
