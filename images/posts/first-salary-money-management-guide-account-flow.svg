<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
  <title id="t">실수령액 250만 원 통장 나누기 흐름</title>
  <desc id="d">실수령액 250만 원이 월급통장에 들어오면 고정비 50만 원은 월급통장에 남기고, 생활비 통장에 125만 원, 저축·투자 통장에 75만 원을 월급날 다음 날 자동이체합니다. 저축 75만 원은 비상금이 다 찰 때까지 파킹통장으로 먼저 보내고, 그 뒤 적금·연금저축·ISA로 나눕니다.</desc>
  <rect x="0" y="0" width="560" height="560" rx="22" fill="#f8fafc"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="32" y="56" font-size="27" font-weight="800" fill="#0f172a">월급날 다음 날, 통장 나누기</text>
    <text x="32" y="90" font-size="17" fill="#475569">실수령액 250만 원 예시 · 자동이체</text>

    <rect x="140" y="112" width="280" height="76" rx="14" fill="#1e40af"/>
    <text x="280" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#dbeafe">월급통장</text>
    <text x="280" y="174" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">250만 원 입금</text>

    <path d="M280 188 V214 M98 214 H462 M98 214 V240 M280 214 V240 M462 214 V240" stroke="#94a3b8" stroke-width="3" fill="none"/>

    <rect x="24" y="240" width="148" height="128" rx="14" fill="#e2e8f0"/>
    <text x="98" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">고정비</text>
    <text x="98" y="310" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">50만 원</text>
    <text x="98" y="340" text-anchor="middle" font-size="15" fill="#475569">월세·통신·보험</text>
    <text x="98" y="360" text-anchor="middle" font-size="15" fill="#475569">월급통장에 둠</text>

    <rect x="196" y="240" width="168" height="128" rx="14" fill="#dbeafe"/>
    <text x="280" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">생활비 통장</text>
    <text x="280" y="310" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">125만 원</text>
    <text x="280" y="340" text-anchor="middle" font-size="15" fill="#475569">체크카드 연결</text>
    <text x="280" y="360" text-anchor="middle" font-size="15" fill="#475569">식비·교통·쇼핑</text>

    <rect x="388" y="240" width="148" height="128" rx="14" fill="#dcfce7"/>
    <text x="462" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">저축·투자</text>
    <text x="462" y="310" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">75만 원</text>
    <text x="462" y="340" text-anchor="middle" font-size="15" fill="#475569">실수령의 30%</text>
    <text x="462" y="360" text-anchor="middle" font-size="15" fill="#475569">가장 먼저 이체</text>

    <path d="M462 368 V396" stroke="#16a34a" stroke-width="3" fill="none"/>
    <path d="M454 390 L462 402 L470 390" stroke="#16a34a" stroke-width="3" fill="none"/>

    <rect x="24" y="406" width="512" height="62" rx="14" fill="#fef3c7"/>
    <text x="44" y="434" font-size="17" font-weight="800" fill="#92400e">1단계 · 비상금 파킹통장</text>
    <text x="44" y="458" font-size="15" fill="#78350f">생활비 3개월치(525만 원)가 찰 때까지 75만 원 전부</text>

    <rect x="24" y="480" width="512" height="62" rx="14" fill="#dcfce7"/>
    <text x="44" y="508" font-size="17" font-weight="800" fill="#166534">2단계 · 적금 · 연금저축 · ISA</text>
    <text x="44" y="532" font-size="15" fill="#14532d">비상금이 차면 쓸 시기에 맞춰 나눠 담기</text>
  </g>
</svg>
