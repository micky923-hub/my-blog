<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="하루 1분 경제 용어 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
  </defs>

  <!-- 배경 타일 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M116 0h280a116 116 0 0 1 116 116v40C400 210 112 210 0 156v-40A116 116 0 0 1 116 0z" fill="url(#shine)"/>

  <!-- 뒤 카드 (모은 카드) -->
  <g transform="rotate(-10 256 270)">
    <rect x="118" y="120" width="260" height="300" rx="30" fill="#312e81" opacity="0.3" transform="translate(8 12)"/>
    <rect x="118" y="120" width="260" height="300" rx="30" fill="url(#back)"/>
  </g>

  <!-- 앞 카드 (오늘의 용어) -->
  <rect x="150" y="110" width="250" height="300" rx="30" fill="#312e81" opacity="0.3" transform="translate(8 12)"/>
  <rect x="150" y="110" width="250" height="300" rx="30" fill="url(#card)"/>
  <circle cx="275" cy="190" r="44" fill="#4f46e5"/>
  <text x="275" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900" fill="#ffffff">₩</text>
  <rect x="190" y="262" width="170" height="20" rx="10" fill="#a5b4fc"/>
  <rect x="190" y="302" width="140" height="20" rx="10" fill="#c7d2fe"/>
  <rect x="190" y="342" width="110" height="20" rx="10" fill="#c7d2fe"/>

  <!-- 정답 배지 -->
  <circle cx="390" cy="390" r="66" fill="#14532d" opacity="0.3" transform="translate(6 10)"/>
  <circle cx="390" cy="390" r="66" fill="url(#badge)"/>
  <polyline points="358,392 382,416 424,368" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 반짝임 -->
  <path d="M112 92l10 24 24 10-24 10-10 24-10-24-24-10 24-10z" fill="#ffffff" opacity="0.9"/>
</svg>
