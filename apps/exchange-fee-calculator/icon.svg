<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="환전 수수료 계산기 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="usd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 배경 타일 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M116 0h280a116 116 0 0 1 116 116v40C400 210 112 210 0 156v-40A116 116 0 0 1 116 0z" fill="url(#shine)"/>

  <!-- 교환 화살표 (⇄ 회전): 위 호는 $ → ₩, 아래 호는 ₩ → $ -->
  <g opacity="0.95" fill="#ffffff" stroke="#ffffff">
    <path d="M281.7 114.2A148 148 0 0 1 391.2 199.8" fill="none" stroke-width="30" stroke-linecap="round"/>
    <path d="M409.1 240.0L418.6 187.6L363.8 212.0Z" stroke-width="10" stroke-linejoin="round"/>
    <path d="M230.3 405.8A148 148 0 0 1 120.8 320.2" fill="none" stroke-width="30" stroke-linecap="round"/>
    <path d="M102.9 280.0L93.4 332.4L148.2 308.0Z" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- 동전 그림자 -->
  <circle cx="178" cy="190" r="96" fill="#2e1065" opacity="0.35" transform="translate(10 14)"/>
  <circle cx="334" cy="330" r="96" fill="#2e1065" opacity="0.35" transform="translate(10 14)"/>

  <!-- 달러 동전 (왼쪽 위) -->
  <circle cx="178" cy="190" r="96" fill="url(#usd)"/>
  <circle cx="178" cy="190" r="74" fill="none" stroke="#f0fdf4" stroke-width="7" opacity="0.8"/>
  <text x="178" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="900" fill="#14532d">$</text>

  <!-- 원화 동전 (오른쪽 아래) -->
  <circle cx="334" cy="330" r="96" fill="url(#gold)"/>
  <circle cx="334" cy="330" r="74" fill="none" stroke="#fef3c7" stroke-width="7" opacity="0.8"/>
  <text x="334" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#78350f">₩</text>

  <!-- % 배지 (우대율) -->
  <circle cx="414" cy="112" r="52" fill="#ffffff"/>
  <text x="414" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#6d28d9">%</text>
</svg>
