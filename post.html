<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파이낸셜 다이어리</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)" id="hljs-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" id="hljs-dark">
  <script>
    (function() {
      var t = document.documentElement.getAttribute('data-theme');
      if (t === 'dark') {
        document.getElementById('hljs-light').media = 'not all';
        document.getElementById('hljs-dark').media = 'all';
      } else if (t === 'light') {
        document.getElementById('hljs-light').media = 'all';
        document.getElementById('hljs-dark').media = 'not all';
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="index.html">파이낸셜 다이어리</a></h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="container">
    <a href="index.html" class="back-link">&larr; 목록으로</a>
    <article>
      <header id="post-header"></header>
      <div id="post-content" class="post-content">
        <p class="loading">글을 불러오는 중...</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 파이낸셜 다이어리</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
